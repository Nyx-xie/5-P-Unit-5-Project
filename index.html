<!DOCTYPE html>
<html>

<head>
  <title>Unit 5 Project</title>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lavishly+Yours&display=swap" rel="stylesheet">
  <style>
body{ background-color: rgb(255, 132, 186);
     text-align: center;
      font-family: "Lavishly Yours", cursive;
  }

  .flip-card {
  background-color: transparent;
  width: 300px;
  height:300px;
  perspective: 1000px;
  
}

.flip-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  text-align: center;
  transition: transform 0.6s;
  transform-style: preserve-3d;
  box-shadow: 0 4px 8px 0 rgb(255, 0, 106);
}

.flip-card:hover .flip-card-inner {
  transform: rotateY(180deg);
}

.flip-card-front, .flip-card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

.flip-card-front {
  background-color: #bbb;
  color: black;
}

.flip-card-back {
  background-color: #ff9fcc;
  color: rgb(255, 0, 149);
  transform: rotateY(180deg);
}
  </style>
</head>
<body>
<div class="flip-card">
  <div class="flip-card-inner">
    <div class="flip-card-front">
      <img src="https://i.pinimg.com/originals/22/db/47/22db47c2519d77d0af2f0135c4445750.jpg" alt="Avatar" style="width:300px;height:300px;">
    </div>
    <div class="flip-card-back">
      <h1><strong>You are Offically Invited to <br> the Nyx landia Masquerade Ball </strong></h1>
      <p>Hosted by King Nyx of Nyx Landia</p>
      <p><em>Long may they reign</em></p>
    </div>
  </div>
</div>
 

</body>
</html>
